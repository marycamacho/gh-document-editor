[package]
name = "gh-document-editor"
version = "0.1.0"
description = "Docs Editor — edit team markdown docs via GitHub PRs, no git in sight"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
