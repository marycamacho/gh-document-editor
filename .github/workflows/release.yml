# Release: push a version tag (v0.1.0) → build signed installers → draft GitHub Release.
#
# Builds macOS (Apple Silicon + Intel, signed & notarized when the APPLE_*
# secrets are present) and Windows (unsigned — users click through SmartScreen).
# The release is created as a draft so Mary reviews and publishes it.
#
# Required repo secrets for macOS signing (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password chosen when exporting the .p12
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     Apple ID email (for notarization)
#   APPLE_PASSWORD               app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                the 10-character team ID

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Fail fast, before three build runners spin up: version consistency,
  # Tauri crate/npm alignment, and the full test suite.
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Preflight (versions + alignment)
        run: node scripts/preflight.mjs

      - name: Frontend tests
        run: npm run test:run

      - name: Type check
        run: npm run check

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Docs Editor ${{ github.ref_name }}"
          releaseBody: |
            Installers below — pick your platform:
            - **Mac:** the `.dmg` (Apple Silicon = `aarch64`, Intel = `x64`)
            - **Windows:** the `.msi` (or the `-setup.exe`)
            - **Linux:** the `.AppImage` (any distro; make it executable and run), or `.deb`/`.rpm`
          releaseDraft: true
          args: --target ${{ matrix.target }}
