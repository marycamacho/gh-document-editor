# Release: push a version tag (v0.1.0) → build signed installers → draft GitHub Release.
#
# Builds macOS (Apple Silicon + Intel, signed & notarized when the APPLE_*
# secrets are present) and Windows (unsigned — users click through SmartScreen).
# The release is created as a draft so Mary reviews and publishes it.
#
# Required repo secrets for macOS signing (Settings → Secrets → Actions):
#   APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   password chosen when exporting the .p12
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     Apple ID email (for notarization)
#   APPLE_PASSWORD               app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                the 10-character team ID

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Docs Editor ${{ github.ref_name }}"
          releaseBody: |
            Installers below — pick your platform:
            - **Mac:** the `.dmg` (Apple Silicon = `aarch64`, Intel = `x64`)
            - **Windows:** the `.msi` (or the `-setup.exe`)
          releaseDraft: true
          args: --target ${{ matrix.target }}
